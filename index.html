<style>
/* Layout: one-column phone app inside LINE — table card with tappable seats, seat actions, tabs 結算/戰績 */
:root{
  --bg:#e9efe9; --panel:#f7faf6; --ink:#1d2a24; --muted:#5e6f66; --line:#cdd8d0;
  --felt:#1f5a45; --felt-ink:#ffffff; --tile:#fbf7ec; --tile-edge:#d9cfb4; --tile-back:#2f7a5d;
  --red:#b8322a; --green:#22714c; --blue:#245a9c; --black:#1f1f1f;
  --warn:#c98a12; --win:#1d7a4a; --lose:#b8322a; --line-green:#06c755;
  --f-tile:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101a16; --panel:#17241f; --ink:#e4ece6; --muted:#93a59b; --line:#2a3b33;
  --felt:#2c7a5c; --tile:#efe8d6; --tile-edge:#a99c78; --warn:#e2a93a; --win:#4cc485; --lose:#ec6a5f; color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--f-tile);font-weight:900;font-size:1.45rem;margin:0;letter-spacing:.04em}
.sub{font-size:.78rem;color:var(--muted)}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{font-weight:700;font-size:.9rem;border:0;border-radius:9px;padding:9px 4px;background:transparent;color:var(--muted);cursor:pointer;min-width:0}
.seg button[aria-pressed="true"]{background:var(--felt);color:var(--felt-ink)}
.seg button:disabled{opacity:.3;cursor:default}
.seg small{display:block;font-weight:400;font-size:.68rem;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg.sm button{padding:7px 2px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}

.table{background:var(--felt);color:var(--felt-ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.table .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.table .round{font-family:var(--f-tile);font-weight:900;font-size:1.3rem;letter-spacing:.06em}
.table .meta{font-size:.78rem;opacity:.88}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seat{background:rgba(255,255,255,.1);border:0;border-radius:10px;padding:10px 4px 7px;text-align:center;min-width:0;position:relative;color:var(--felt-ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.seat .w{font-family:var(--f-tile);font-weight:900;font-size:1rem;line-height:1}
.seat .av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:700;font-size:.85rem;margin:3px 0 1px}
.seat .nm{font-size:.74rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .sc{font-size:.72rem;font-variant-numeric:tabular-nums;opacity:.9}
.seat.me{background:rgba(255,255,255,.26);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75)}
.seat.empty{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4);border-style:dashed}
.seat.empty .av{background:transparent;border:1.5px dashed rgba(255,255,255,.6)}
.seat.sel{outline:2px solid var(--warn);outline-offset:1px}
.tag{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:.62rem;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--warn);color:#1b1300;white-space:nowrap}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:.95rem}
.hint{font-size:.78rem;color:var(--muted);line-height:1.5;margin:0}
.lbl{font-size:.78rem;color:var(--muted);letter-spacing:.06em;margin-bottom:-4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{flex:1;min-width:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.76rem;color:var(--muted);min-width:0}
.form input,.form select,.inp{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 8px;width:100%;min-width:0}
.form .full{grid-column:1/-1}
.stake{font-size:1.05rem!important;font-weight:700}
details summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted)}

.sec{font-size:.74rem;color:var(--muted);letter-spacing:.14em;margin:6px 0 -2px}
.tai{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 11px;cursor:pointer;width:100%}
.tai .hd{display:flex;align-items:center;gap:8px}
.tai .nm{font-weight:700;font-size:.95rem;flex:1}
.tai .v{font-weight:700;font-size:.82rem;font-variant-numeric:tabular-nums;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.tai .chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.8rem;color:transparent}
.tai .ds{font-size:.76rem;color:var(--muted);line-height:1.45}
.tai[aria-pressed="true"]{border-color:var(--felt);box-shadow:inset 0 0 0 1.5px var(--felt);background:var(--panel)}
.tai[aria-pressed="true"] .chk{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.tai[aria-pressed="true"] .v{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.ex{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;row-gap:6px}
.ex .gap{width:7px}
.ex .dots{font-size:.8rem;color:var(--muted);padding:0 2px}
.ex .note{font-size:.68rem;color:var(--muted);margin-left:4px;align-self:center}
.mt{width:20px;height:27px;background:var(--tile);border:1px solid var(--tile-edge);border-bottom:3px solid var(--tile-back);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-tile);line-height:1;flex:none;position:relative}
.mt .a{font-size:.68rem;font-weight:900}
.mt .b{font-size:.5rem;font-weight:600;margin-top:1px}
.mt .c{font-size:.82rem;font-weight:900}
.mt .wb{width:11px;height:14px;border:1.5px solid var(--blue);border-radius:1px}
.mt.win{box-shadow:0 0 0 2px var(--warn);transform:translateY(-3px)}
.mt.open{border-bottom-color:var(--tile-edge);opacity:.85}
.mt.open::after{content:"";position:absolute;left:2px;right:2px;bottom:-7px;height:2px;background:var(--muted);border-radius:1px}
.m .a{color:var(--black)} .m .b{color:var(--red)}
.p .a,.p .b{color:var(--blue)}
.s .a,.s .b{color:var(--green)}
.c-red{color:var(--red)} .c-green{color:var(--green)} .c-blue{color:var(--blue)} .c-black{color:var(--black)}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);align-items:center}
.key span{display:inline-flex;align-items:center;gap:6px}

.stepper{display:flex;align-items:center;gap:8px;font-size:.86rem;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:8px 11px;flex-wrap:wrap}
.stepper .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.stepper .txt b{font-size:.95rem}
.stepper button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:1.1rem;cursor:pointer}
.stepper output{min-width:2ch;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

.sum{display:flex;flex-direction:column;gap:4px;font-size:.86rem}
.sum .r{display:flex;justify-content:space-between;gap:8px}
.sum .total{font-size:1.15rem;font-weight:700}
.pay{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pay div{background:var(--bg);border-radius:8px;padding:6px 4px;text-align:center;font-size:.75rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay b{display:block;font-size:.95rem;font-variant-numeric:tabular-nums}
.pos{color:var(--win)} .neg{color:var(--lose)}
.primary{background:var(--felt);color:var(--felt-ink);border:0;border-radius:12px;padding:14px;font-weight:700;font-size:1rem;cursor:pointer}
.primary:disabled{opacity:.4;cursor:default}
.ghost{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700;font-size:.88rem;cursor:pointer}
.ghost:disabled{opacity:.4}
.line-btn{background:var(--line-green);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:.92rem;cursor:pointer}
.danger{color:var(--red)!important}
.empty{font-size:.8rem;color:var(--muted)}

.totals{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:1.6em 1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg)}
.trow.me{box-shadow:inset 0 0 0 1.5px var(--felt)}
.trow .rk{font-family:var(--f-tile);font-weight:900;color:var(--muted)}
.trow .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .wins{font-size:.74rem;color:var(--muted)}
.trow .money{font-weight:700;font-variant-numeric:tabular-nums;min-width:5ch;text-align:right}
.h{padding:9px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;font-size:.84rem}
.h:last-child{border-bottom:0}
.h .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.h .rd{font-family:var(--f-tile);font-weight:700}
.h .ds{color:var(--muted);font-size:.78rem;line-height:1.5}
.h .dl{display:flex;gap:10px;flex-wrap:wrap;font-size:.76rem;font-variant-numeric:tabular-nums}
.boot{align-items:flex-start}
.boot h3{font-size:1.05rem}
.hello{display:flex;align-items:center;gap:12px}
.hello img,.hello .ph{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.85rem;z-index:20;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>麻將結算</h1>
    <span class="sub" id="hdrSub">台灣十六張</span>
  </header>

  <!-- 啟動／錯誤畫面 -->
  <div class="panel boot" id="boot">
    <h3 id="bootTitle">連線中…</h3>
    <p class="hint" id="bootMsg">正在用 LINE 登入</p>
    <div class="row" id="bootAct"></div>
  </div>

  <!-- 大廳：還沒進桌 -->
  <div class="stack" id="lobby" hidden>
    <div class="panel">
      <div class="hello"><span id="helloPic"></span><div><b id="helloName"></b><p class="hint">開一桌，再把連結傳到 LINE 群組，牌友點開就能入座。</p></div></div>
      <button class="primary" id="newRoom">開一桌新的</button>
      <button class="ghost" id="lastRoom" hidden>回到上次那一桌</button>
      <p class="hint">要加入別人開的桌，請點他在 LINE 傳來的連結。</p>
    </div>
  </div>

  <!-- 牌桌 -->
  <div class="stack" id="room" hidden>
    <div class="table">
      <div class="top">
        <span class="round" id="roundName">東風東</span>
        <span class="meta" id="roundMeta"></span>
      </div>
      <div class="seats" id="seats"></div>
    </div>

    <div class="panel" id="seatAct" hidden></div>

    <div class="row">
      <button class="line-btn" id="inviteBtn">邀請牌友入座</button>
      <button class="ghost" id="copyLink">複製連結</button>
    </div>

    <div class="seg sticky" id="tabs">
      <button data-tab="settle" aria-pressed="true">結算這局</button>
      <button data-tab="record" aria-pressed="false">戰績</button>
    </div>

    <!-- 結算 -->
    <div class="stack" id="tab-settle">
      <div class="panel">
        <div class="lbl">這局結果</div>
        <div class="seg sm" id="resType">
          <button data-v="zimo" aria-pressed="false">自摸</button>
          <button data-v="fang" aria-pressed="false">放槍</button>
          <button data-v="draw" aria-pressed="false">流局</button>
        </div>
        <div class="stack" id="winBox" hidden style="gap:10px">
          <div class="lbl">誰胡牌</div>
          <div class="seg sm" id="winSel"></div>
        </div>
        <div class="stack" id="loseWrap" hidden style="gap:10px">
          <div class="lbl">誰放槍</div>
          <div class="seg sm" id="loseSel"></div>
        </div>
      </div>

      <div class="panel" id="taiPanel" hidden>
        <h3>台數</h3>
        <p class="hint">點選胡牌符合的項目。莊家台與連莊拉莊會自動另外算。</p>
        <div class="key">
          <span><span class="mt win m"><span class="a">五</span><span class="b">萬</span></span>胡的那張</span>
          <span><span class="mt open m"><span class="a">五</span><span class="b">萬</span></span>吃碰槓攤出來的</span>
        </div>
        <div class="stack" id="taiList" style="gap:8px"></div>
      </div>

      <div class="panel" id="sumPanel" hidden>
        <div class="sum" id="sum"></div>
        <div class="pay" id="payPreview"></div>
        <button class="primary" id="commit" disabled>記錄這一局</button>
        <p class="hint">記錄後同桌每個人的手機都會馬上更新，並自動換莊或連莊、換風圈。</p>
      </div>

      <div class="panel">
        <h3>金額與莊家</h3>
        <div class="form">
          <label class="full">底／台
            <select id="selStake" class="stake">
              <option value="30/10">底 30・每台 10</option>
              <option value="50/10">底 50・每台 10</option>
              <option value="50/20">底 50・每台 20</option>
              <option value="100/20">底 100・每台 20</option>
              <option value="100/30">底 100・每台 30</option>
              <option value="100/50">底 100・每台 50</option>
              <option value="200/50">底 200・每台 50</option>
              <option value="300/100">底 300・每台 100</option>
              <option value="500/100">底 500・每台 100</option>
              <option value="1000/200">底 1000・每台 200</option>
              <option value="custom">自訂…</option>
            </select>
          </label>
          <label id="customBase" hidden>底（元）<input id="inBase" type="number" inputmode="numeric" min="0"></label>
          <label id="customPer" hidden>每台（元）<input id="inPer" type="number" inputmode="numeric" min="0"></label>
          <label class="full">起莊（第一局的莊家）<select id="selStart"></select></label>
        </div>
        <details>
          <summary>調整目前風圈、莊家、連莊</summary>
          <div class="form" style="margin-top:10px">
            <label>目前風圈<select id="selRound"><option value="0">東風圈</option><option value="1">南風圈</option><option value="2">西風圈</option><option value="3">北風圈</option></select></label>
            <label>目前莊家<select id="selDealer"></select></label>
            <label>連莊次數<input id="inStreak" type="number" inputmode="numeric" min="0" max="20"></label>
            <label>莊家台<select id="selDealerRule"><option value="std">莊 1 台＋連 N 拉 N</option><option value="none">不算莊家台</option></select></label>
          </div>
        </details>
        <p class="hint">這裡的設定同桌共用，任何人改了大家都會跟著變。</p>
      </div>
    </div>

    <!-- 戰績 -->
    <div class="stack" id="tab-record" hidden>
      <div class="panel">
        <h3>總輸贏</h3>
        <div class="totals" id="totals"></div>
        <button class="line-btn" id="shareResult">把戰績傳到 LINE</button>
      </div>
      <div class="panel">
        <h3>每局紀錄</h3>
        <div id="hist"></div>
        <div class="row">
          <button class="ghost" id="undoHand">復原上一局</button>
          <button class="ghost danger" id="newGame">整將重來</button>
        </div>
        <div id="confirmBox" hidden class="hint"></div>
      </div>
      <button class="ghost" id="toLobby">離開這一桌</button>
    </div>
  </div>
</div>
<script>
const W=["東","南","西","北"];
const NUMS=["一","二","三","四","五","六","七","八","九"];
const HON={1:["東","black"],2:["南","black"],3:["西","black"],4:["北","black"],5:["中","red"],6:["發","green"],7:["白","blue"]};
const FLO={1:["春","red"],2:["夏","red"],3:["秋","red"],4:["冬","red"],5:["梅","blue"],6:["蘭","blue"],7:["竹","blue"],8:["菊","blue"]};

/* 小牌：m萬 p筒 s條 z字 f花；* 開頭 = 胡的那張；_ 開頭 = 攤出來的；| = 分組；… = 省略 */
function mini(code){
  let cls="mt";
  if(code[0]==="*"){cls+=" win";code=code.slice(1)}
  if(code[0]==="_"){cls+=" open";code=code.slice(1)}
  const k=code[0],n=+code.slice(1);
  if(k==="m"||k==="p"||k==="s")return `<span class="${cls} ${k}"><span class="a">${NUMS[n-1]}</span><span class="b">${{m:"萬",p:"筒",s:"條"}[k]}</span></span>`;
  if(k==="z"){if(n===7)return `<span class="${cls}"><span class="wb"></span></span>`;const [c,col]=HON[n];return `<span class="${cls}"><span class="c c-${col}">${c}</span></span>`}
  if(k==="f"){const [c,col]=FLO[n];return `<span class="${cls}"><span class="c c-${col}">${c}</span></span>`}
  return "";
}
function ex(str){
  if(!str)return "";
  return `<div class="ex" aria-hidden="true">${str.split(" ").map(t=>t==="|"?`<span class="gap"></span>`:t==="…"?`<span class="dots">…</span>`:t.startsWith("#")?`<span class="note">${t.slice(1).replace(/_/g," ")}</span>`:mini(t)).join("")}</div>`;
}

/* 台數表 */
const TAI=[
  {sec:"基本"},
  {id:"menqing",name:"門清",v:1,ds:"整局沒有吃、碰、明槓，牌全部在自己手上。",ex:"m2 m3 m4 | p5 p6 p7 | s3 s3 s3 | … #都沒攤牌"},
  {id:"zimo",name:"自摸",v:1,ds:"胡的那張是自己摸到的。和門清一起算「不求人」共 3 台。",onlyZimo:1},

const TAIBY=Object.fromEntries(TAI.filter(x=>x.id).map(x=>[x.id,x]));
const HUA_EX=["f1 f5","f2 f6","f3 f7","f4 f8"]; // 東家春梅、南家夏蘭…

/* ================= 狀態 ================= */
const $=id=>document.getElementById(id);

let draft=blankDraft(); // 這局正在填的結算（只在自己手機）
let tab="settle", selSeat=null, customStake=false, busy=false;

function blankDraft(){return {type:null,winner:null,loser:null,items:{},hua:0,huagang:0,adj:0}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const money=v=>(v>0?"+":"")+Number(v).toLocaleString("zh-TW");
const seatWind=(i,dealer)=>(i-dealer+4)%4;
const roundLabel=(r,d,start)=>W[Math.min(r,3)]+"風"+W[(d-start+4)%4];
const ts=()=>firebase.firestore.FieldValue.serverTimestamp();
function nm(i,room){room=room||R;const s=room&&room.seats[i];return s?s.name:"空位"}
function mySeat(room){room=room||R;return room?room.seats.findIndex(s=>s&&s.uid===me.uid):-1}
class AppErr extends Error{constructor(msg){super(msg);this.msg=msg}}

/* ================= 計算 ================= */
function dealerTai(g,st){return st.dealerRule==="none"?0:1+2*g.streak}
function baseTai(d){
  let t=0;for(const k in d.items)if(d.items[k]&&TAIBY[k])t+=TAIBY[k].v;
  if(d.items.menqing&&d.items.zimo)t+=1; // 門清自摸＝不求人
  return t+d.hua+d.huagang*2+d.adj;
}
function calc(room,d){
  const g=room.game,st=room.setup,deltas=[0,0,0,0];
  if(d.type==="draw"||d.winner==null)return {deltas,tai:0,dt:0};
  const bt=baseTai(d),dt=dealerTai(g,st);
  const payers=d.type==="zimo"?[0,1,2,3].filter(i=>i!==d.winner&&room.seats[i]):(d.loser==null?[]:[d.loser]);
  for(const p of payers){
    const inv=(d.winner===g.dealer||p===g.dealer)?dt:0;
    const amt=st.base+(bt+inv)*st.per;
    deltas[p]-=amt;deltas[d.winner]+=amt;
  }
  return {deltas,tai:bt,dt};
}
function buildHand(room,d){
  const g=room.game,res=calc(room,d);
  return {at:Date.now(),by:me.uid,byName:me.name,names:[0,1,2,3].map(i=>nm(i,room)),
    round:g.round,dealer:g.dealer,streak:g.streak,label:roundLabel(g.round,g.dealer,room.setup.start),
    type:d.type,winner:d.winner==null?null:d.winner,loser:d.loser==null?null:d.loser,
    tai:res.tai,dt:res.dt,deltas:res.deltas,
    items:Object.keys(d.items).filter(k=>d.items[k]),hua:d.hua,huagang:d.huagang,adj:d.adj};
}
function nextGame(room,h){
  const g={round:room.game.round,dealer:room.game.dealer,streak:room.game.streak};
  if(h.type==="draw"||h.winner===g.dealer)g.streak++;
  else{g.streak=0;g.dealer=(g.dealer+1)%4;if(g.dealer===room.setup.start)g.round++}
  return g;
}
const dealerInvolved=h=>h.winner===h.dealer||h.type==="zimo"||h.loser===h.dealer;
const handTotal=h=>h.tai+(dealerInvolved(h)?h.dt:0);
function handLine(h){return h.type==="draw"?`${h.label} 流局，${h.names[h.dealer]} 連莊`:`${h.label}：${h.names[h.winner]} ${h.type==="zimo"?"自摸":"胡 "+h.names[h.loser]}，${handTotal(h)} 台`}
function totals(room){const t=[0,0,0,0];room.hands.forEach(h=>h.deltas.forEach((v,i)=>t[i]+=v));return t}

/* ================= 畫面切換 ================= */
function show(which){["boot","lobby","room"].forEach(s=>$(s).hidden=s!==which)}
function bootMsg(title,msg,actions){
  show("boot");$("bootTitle").textContent=title;$("bootMsg").textContent=msg;
  const box=$("bootAct");box.innerHTML="";
  (actions||[]).forEach(([label,fn,cls])=>{const b=document.createElement("button");b.className=cls||"ghost";b.textContent=label;b.onclick=fn;box.appendChild(b)});
}
let tt;function toast(msg){let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}
  el.textContent=msg;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,3000)}

/* ================= 啟動 ================= */
async function start(){
  if(typeof LIFF_ID!=="string"||!LIFF_ID||LIFF_ID.includes("請貼上")||!firebaseConfig||!firebaseConfig.projectId){
    bootMsg("還沒完成設定","請照設定教學，把 LIFF ID 和 Firebase 設定貼到 index.html 最上面的設定區。");return}
  if(!window.liff||!window.firebase){bootMsg("載入失敗","網路可能不穩，請關掉重新打開。",[["重新整理",()=>location.reload()]]);return}
  try{await liff.init({liffId:LIFF_ID})}
  catch(e){bootMsg("LINE 連線失敗","LIFF ID 可能貼錯，或這個網址和 LINE 後台填的 Endpoint URL 不一樣。（"+(e.message||e)+"）");return}
  if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
  try{const p=await liff.getProfile();me={uid:p.userId,name:p.displayName||"玩家",pic:p.pictureUrl||""}}
  catch(e){bootMsg("讀不到你的 LINE 名字","請確認 LIFF 設定的 Scopes 有勾選 profile。");return}
  try{
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    await firebase.auth().signInAnonymously();
    db=firebase.firestore();
  }catch(e){bootMsg("資料庫連線失敗","請確認 Firebase 的「匿名」登入已啟用，設定整段有貼對。（"+(e.code||e.message||e)+"）");return}
  const q=new URLSearchParams(location.search).get("room");
  if(q)openRoom(q.toUpperCase());else showLobby();
}

/* ================= 大廳 ================= */
function lastRoomId(){try{return localStorage.getItem("mj-last-room")}catch(e){return null}}
function showLobby(){
  if(unsub){unsub();unsub=null}R=null;roomId=null;ref=null;
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  show("lobby");
  $("helloName").textContent="嗨，"+me.name;
  $("helloPic").innerHTML=me.pic?`<img src="${esc(me.pic)}" alt="">`:`<span class="ph"></span>`;
  const last=lastRoomId();$("lastRoom").hidden=!last;
  if(last)$("lastRoom").textContent="回到上次那一桌（"+last+"）";
  $("hdrSub").textContent="台灣十六張";
}
function randId(){const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
async function createRoom(){
  if(busy)return;busy=true;$("newRoom").disabled=true;
  try{
    const id=randId();
    const seats=[null,null,null,null];seats[0]={uid:me.uid,name:me.name,pic:me.pic,line:true};
    await db.collection("rooms").doc(id).set({createdAt:ts(),updatedAt:ts(),createdBy:me.uid,
      setup:{base:100,per:20,start:0,dealerRule:"std"},seats,game:{round:0,dealer:0,streak:0},hands:[]});
    openRoom(id);
    toast("開好了！按「邀請牌友入座」把連結傳到 LINE");
  }catch(e){toast("開桌失敗："+(e.code||e.message||"請檢查 Firestore 規則"))}
  finally{busy=false;$("newRoom").disabled=false}
}

/* ================= 進桌與同步 ================= */
function openRoom(id){
  if(unsub)unsub();
  roomId=id;ref=db.collection("rooms").doc(id);R=null;draft=blankDraft();selSeat=null;
  try{history.replaceState(null,"","?room="+id)}catch(e){}
  try{localStorage.setItem("mj-last-room",id)}catch(e){}
  bootMsg("進入牌桌中…","桌號 "+id);
  unsub=ref.onSnapshot(snap=>{
    if(!snap.exists){bootMsg("找不到這一桌","桌號 "+id+" 不存在，可能連結打錯了。",[["開一桌新的",()=>{showLobby()},"primary"]]);return}
    onRoom(snap.data());
  },err=>bootMsg("讀不到牌桌資料","請確認 Firestore 的規則已經發布。（"+(err.code||err.message)+"）",[["重新整理",()=>location.reload()]]));
}
function onRoom(data){
  const prev=R;R=data;
  if(prev&&prev.hands.length!==R.hands.length){
    draft=blankDraft();
    if(R.hands.length>prev.hands.length){const h=R.hands[R.hands.length-1];if(h.by!==me.uid)toast(`${h.byName} 記錄了 ${handLine(h)}`)}
    else if(R.hands.length===0)toast("這一將已重新開始");
    else toast("上一局已被復原");
  }
  show("room");renderAll();
}

/* ================= 牌桌卡與座位 ================= */
function renderTable(){
  const g=R.game,st=R.setup,over=g.round>3,tot=totals(R),mine=mySeat();
  $("hdrSub").textContent="桌號 "+roomId;
  $("roundName").textContent=over?"一將結束":roundLabel(g.round,g.dealer,st.start);
  $("roundMeta").textContent=over?`共 ${R.hands.length} 局`:`第 ${R.hands.length+1} 局・底 ${st.base}／台 ${st.per}`;
  $("seats").innerHTML=[0,1,2,3].map(i=>{
    const s=R.seats[i],w=W[seatWind(i,g.dealer)];
    const tag=i===g.dealer?`<span class="tag">莊${g.streak?" 連"+g.streak:""}</span>`:"";
    if(!s)return `<button class="seat empty${selSeat===i?" sel":""}" data-seat="${i}">${tag}<span class="w">${w}</span><span class="av">＋</span><span class="nm">入座</span><span class="sc">${tot[i]?money(tot[i]):"&nbsp;"}</span></button>`;
    const av=s.pic?`<img class="av" src="${esc(s.pic)}" alt="">`:`<span class="av">${esc(s.name.slice(0,1))}</span>`;
    return `<button class="seat${i===mine?" me":""}${selSeat===i?" sel":""}" data-seat="${i}">${tag}<span class="w">${w}</span>${av}<span class="nm">${i===mine?"我・":""}${esc(s.name)}</span><span class="sc">${money(tot[i])}</span></button>`;
  }).join("");
  $("inviteBtn").textContent=R.seats.filter(Boolean).length<4?"邀請牌友入座":"傳桌號連結到 LINE";
  renderSeatAct();
}
function renderSeatAct(){
  const box=$("seatAct");
  if(selSeat==null){box.hidden=true;box.innerHTML="";return}
  const i=selSeat,s=R.seats[i],mine=mySeat(),w=W[seatWind(i,R.game.dealer)];
  let html="";
  if(!s){
    html=`<h3>${w}家（座位 ${i+1}）是空位</h3>
      <button class="primary" data-act="sit">${mine>=0?"我換到這個位子":"我坐這裡"}</button>
      ${mine>=0&&R.hands.length?`<p class="hint">換位子後，輸贏會跟著座位走，不會跟著人。</p>`:""}
      <div class="row"><input class="inp" id="guestName" maxlength="8" placeholder="沒有手機的牌友，輸入名字"><button class="ghost" data-act="guest" style="flex:none">代他入座</button></div>`;
  }else if(s.uid===me.uid){
    html=`<h3>這是你的位子</h3><button class="ghost danger" data-act="leave">離開這個位子</button>`;
  }else{
    html=`<h3>${w}家：${esc(s.name)}${s.line?"":"（代坐）"}</h3>
      <p class="hint">${s.line?"這位牌友用 LINE 入座。如果他已經離開，可以請他離座，讓別人坐。":"這是幫沒有手機的牌友代坐的位子。"}</p>
      <button class="ghost danger" data-act="leave">${s.line?"請他離座":"移除代坐"}</button>`;
  }
  html+=`<button class="ghost" data-act="close">取消</button>`;
  box.innerHTML=html;box.hidden=false;
}
async function seatTx(fn){
  try{
    await db.runTransaction(async tx=>{
      const snap=await tx.get(ref);const d=snap.data();const seats=d.seats.slice();
      fn(seats,d);tx.update(ref,{seats,updatedAt:ts()});
    });
    selSeat=null;renderTable();return true;
  }catch(e){toast(e.msg||"沒有成功，請再試一次");return false}
}
async function seatAction(act){
  const i=selSeat;
  if(act==="close"){selSeat=null;renderTable();return}
  if(act==="sit"){if(await seatTx(seats=>{if(seats[i])throw new AppErr("這個位子剛剛被別人坐走了");
      const j=seats.findIndex(x=>x&&x.uid===me.uid);if(j>=0)seats[j]=null;
      seats[i]={uid:me.uid,name:me.name,pic:me.pic||"",line:true}}))toast("已入座");return}
  if(act==="guest"){const name=($("guestName").value||"").trim();if(!name){toast("請先輸入名字");$("guestName").focus();return}
    if(await seatTx(seats=>{if(seats[i])throw new AppErr("這個位子剛剛被別人坐走了");seats[i]={name,pic:"",line:false,by:me.uid}}))toast(name+" 已入座");return}
  if(act==="leave"){if(await seatTx(seats=>{seats[i]=null}))toast("已離座");return}
}

/* ================= 結算 ================= */
function seatBtns(el,sel,exclude){
  el.innerHTML=[0,1,2,3].map(i=>{const empty=!R.seats[i];
    return `<button data-v="${i}" aria-pressed="${sel===i}"${i===exclude||empty?" disabled":""}>${W[seatWind(i,R.game.dealer)]}<small>${esc(nm(i))}${i===mySeat()?"（我）":""}</small></button>`}).join("");
}
function stepper(key,title,desc,exHtml){
  return `<div class="stepper"><div class="txt"><b>${title}</b><span class="hint">${desc}</span>${exHtml||""}</div>
    <button data-step="${key}" data-d="-1" aria-label="${title}減一">−</button><output>${draft[key]}</output><button data-step="${key}" data-d="1" aria-label="${title}加一">＋</button></div>`;
}
function renderSettle(){
  const d=draft,g=R.game;
  if(d.winner!=null&&!R.seats[d.winner])d.winner=null;
  if(d.loser!=null&&!R.seats[d.loser])d.loser=null;
  document.querySelectorAll("#resType button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===d.type));
  const isWin=d.type==="zimo"||d.type==="fang";
  $("winBox").hidden=!isWin;$("loseWrap").hidden=d.type!=="fang";
  seatBtns($("winSel"),d.winner,null);seatBtns($("loseSel"),d.loser,d.winner);
  const showTai=isWin&&d.winner!=null;
  $("taiPanel").hidden=!showTai;$("sumPanel").hidden=!(showTai||d.type==="draw");
  if(showTai){
    const qw=W[Math.min(g.round,3)],mwIdx=seatWind(d.winner,g.dealer),mw=W[mwIdx],zMap={"東":1,"南":2,"西":3,"北":4};
    let html="";
    for(const x of TAI){
      if(x.sec){html+=`<div class="sec">${x.sec}</div>`;continue}
      if(x.onlyZimo&&d.type!=="zimo")continue;
      let name=x.name,exs=x.ex;
      if(x.dyn==="q"){name=`圈風 ${qw}`;exs=`z${zMap[qw]} z${zMap[qw]} z${zMap[qw]}`}
      if(x.dyn==="m"){name=`門風 ${mw}`;exs=`z${zMap[mw]} z${zMap[mw]} z${zMap[mw]}`}
      html+=`<button class="tai" data-tai="${x.id}" aria-pressed="${!!d.items[x.id]}">
        <span class="hd"><span class="chk">✓</span><span class="nm">${name}</span><span class="v">${x.v} 台</span></span>
        <span class="ds">${x.ds}</span>${ex(exs)}</button>`;
    }
    html+=`<div class="sec">花牌數量</div>`;
    html+=stepper("hua","正花",`胡的人門風是「${mw}」，對應的花是這兩張，有幾張算幾台。`,ex(HUA_EX[mwIdx]));
    html+=stepper("huagang","花槓（每組 2 台）","春夏秋冬或梅蘭竹菊湊滿一組四張。",ex("f1 f2 f3 f4 | f5 f6 f7 f8"));
    html+=`<div class="sec">其他</div>`;
    html+=stepper("adj","家規加減台","你們桌上有額外規則時，在這裡加或減。","");
    $("taiList").innerHTML=html;
  }
  const sum=$("sum"),pp=$("payPreview"),btn=$("commit");
  if(d.type==="draw"){
    sum.innerHTML=`<div class="r total"><span>流局</span><span>${esc(nm(g.dealer))} 連莊</span></div>`;
    pp.innerHTML="";btn.disabled=busy;btn.textContent="記錄這一局";
  }else if(showTai){
    const ready=d.type==="zimo"||d.loser!=null,res=calc(R,d),st=R.setup;
    const dInv=d.winner===g.dealer||d.type==="zimo"||d.loser===g.dealer;
    sum.innerHTML=`${d.items.menqing&&d.items.zimo?`<div class="r"><span>門清＋自摸＝不求人</span><span>+1</span></div>`:""}
      <div class="r total"><span>牌型台數</span><span>${res.tai} 台</span></div>
      ${st.dealerRule==="std"&&dInv?`<div class="r"><span>莊家台（${d.winner===g.dealer?"莊家胡":d.type==="zimo"?"只有莊家多付":"莊家放槍"}）</span><span>+${res.dt} 台</span></div>`:""}
      <div class="r"><span>每家付</span><span>底 ${st.base}＋台數×${st.per}</span></div>`;
    pp.innerHTML=ready?[0,1,2,3].map(i=>`<div>${esc(nm(i))}<b class="${res.deltas[i]>0?"pos":res.deltas[i]<0?"neg":""}">${money(res.deltas[i])}</b></div>`).join(""):"";
    btn.disabled=!ready||busy;btn.textContent=ready?"記錄這一局":"先選誰放槍";
  }
}
async function commit(){
  if(busy)return;
  const expected=R.hands.length,d=JSON.parse(JSON.stringify(draft));
  busy=true;$("commit").disabled=true;$("commit").textContent="記錄中…";
  let rec=null;
  try{
    await db.runTransaction(async tx=>{
      const snap=await tx.get(ref);const room=snap.data();
      if(room.hands.length!==expected)throw new AppErr("剛剛已經有人先記錄了這一局，請到「戰績」確認。");
      rec=buildHand(room,d);
      tx.update(ref,{hands:room.hands.concat([rec]),game:nextGame(room,rec),updatedAt:ts()});
    });
    draft=blankDraft();toast("已記錄："+handLine(rec));
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){toast(e.msg||"記錄失敗，請檢查網路後再按一次")}
  finally{busy=false;if(R)renderAll()}
}

/* ================= 設定 ================= */
function fillSetup(){
  const st=R.setup,g=R.game;
  const opts=[0,1,2,3].map(i=>`<option value="${i}">${W[seatWind(i,st.start)]}位 ${esc(nm(i))}</option>`).join("");
  const optsD=[0,1,2,3].map(i=>`<option value="${i}">${esc(nm(i))}</option>`).join("");
  $("selStart").innerHTML=opts;$("selDealer").innerHTML=optsD;
  $("selStart").value=st.start;$("selDealer").value=g.dealer;
  $("selRound").value=Math.min(g.round,3);$("selDealerRule").value=st.dealerRule;
  if(document.activeElement!==$("inStreak"))$("inStreak").value=g.streak;
  const key=st.base+"/"+st.per,sel=$("selStake");
  const has=[...sel.options].some(o=>o.value===key);
  sel.value=(!customStake&&has)?key:"custom";
  const cu=sel.value==="custom";$("customBase").hidden=!cu;$("customPer").hidden=!cu;
  if(document.activeElement!==$("inBase"))$("inBase").value=st.base;
  if(document.activeElement!==$("inPer"))$("inPer").value=st.per;
}
async function onSetup(e){
  const id=e.target.id,v=e.target.value,up={};
  if(id==="selStake"){if(v==="custom"){customStake=true;fillSetup();return}customStake=false;const [b,p]=v.split("/").map(Number);up["setup.base"]=b;up["setup.per"]=p}
  if(id==="inBase")up["setup.base"]=Math.max(0,+v||0);
  if(id==="inPer")up["setup.per"]=Math.max(0,+v||0);
  if(id==="selStart"){up["setup.start"]=+v;if(!R.hands.length)up["game.dealer"]=+v}
  if(id==="selDealer")up["game.dealer"]=+v;
  if(id==="selRound")up["game.round"]=+v;
  if(id==="inStreak")up["game.streak"]=Math.max(0,Math.min(20,+v||0));
  if(id==="selDealerRule")up["setup.dealerRule"]=v;
  if(!Object.keys(up).length)return;
  up.updatedAt=ts();
  try{await ref.update(up)}catch(err){toast("儲存失敗，請檢查網路")}
}

/* ================= 戰績 ================= */
function renderRecord(){
  const tot=totals(R),wins=[0,0,0,0],guns=[0,0,0,0],mine=mySeat();
  R.hands.forEach(h=>{if(h.winner!=null)wins[h.winner]++;if(h.loser!=null)guns[h.loser]++});
  const order=[0,1,2,3].sort((a,b)=>tot[b]-tot[a]);
  $("totals").innerHTML=order.map((i,r)=>`<div class="trow${i===mine?" me":""}">
    <span class="rk">${r+1}</span><span class="nm">${esc(nm(i))}${i===mine?"（我）":""}</span>
    <span class="wins">胡 ${wins[i]}・放槍 ${guns[i]}</span>
    <span class="money ${tot[i]>0?"pos":tot[i]<0?"neg":""}">${money(tot[i])}</span></div>`).join("");
  $("hist").innerHTML=R.hands.length?R.hands.map((h,idx)=>({h,idx})).reverse().map(({h,idx})=>{
    const mw=h.winner!=null?W[seatWind(h.winner,h.dealer)]:"";
    const parts=h.items.map(k=>k==="quanfeng"?"圈風"+W[Math.min(h.round,3)]:k==="menfeng"?"門風"+mw:TAIBY[k]?TAIBY[k].name:k);
    if(h.hua)parts.push("正花×"+h.hua);if(h.huagang)parts.push("花槓×"+h.huagang);if(h.adj)parts.push("家規 "+(h.adj>0?"+":"")+h.adj);
    const title=h.type==="draw"?"流局":`${esc(h.names[h.winner])} ${h.type==="zimo"?"自摸":"胡 "+esc(h.names[h.loser])}`;
    return `<div class="h"><div class="hd"><span class="rd">${idx+1}. ${h.label}${h.streak?" 連"+h.streak:""}</span>
      <span>${title}${h.type!=="draw"?`・${h.tai}${dealerInvolved(h)&&h.dt?"＋莊 "+h.dt:""} 台`:""}</span></div>
      ${parts.length?`<div class="ds">${parts.join("、")}</div>`:""}
      ${h.type!=="draw"?`<div class="dl">${h.deltas.map((v,i)=>v?`<span class="${v>0?"pos":"neg"}">${esc(h.names[i])} ${money(v)}</span>`:"").join("")}</div>`:""}
      <div class="ds">由 ${esc(h.byName)} 記錄</div></div>`}).join("")
    :`<span class="empty">還沒有記錄任何一局。打完一局後在「結算這局」記錄。</span>`;
  $("undoHand").disabled=!R.hands.length;
}
function resultText(){
  const g=R.game,st=R.setup,tot=totals(R),order=[0,1,2,3].filter(i=>R.seats[i]||tot[i]).sort((a,b)=>tot[b]-tot[a]);
  const lines=[`【麻將戰績】桌號 ${roomId}・底 ${st.base}／台 ${st.per}`,
    g.round>3?`一將結束，共 ${R.hands.length} 局`:`目前 ${roundLabel(g.round,g.dealer,st.start)}，已打 ${R.hands.length} 局`,""];
  order.forEach((i,r)=>lines.push(`${r+1}. ${nm(i)}　${money(tot[i])}`));
  const h=R.hands[R.hands.length-1];if(h){lines.push("");lines.push("上一局 "+handLine(h))}
  lines.push("");lines.push("看詳細："+roomLink());
  return lines.join("\n");
}
async function txReset(fn,okMsg){
  try{await db.runTransaction(async tx=>{const snap=await tx.get(ref);const room=snap.data();tx.update(ref,Object.assign(fn(room),{updatedAt:ts()}))});toast(okMsg)}
  catch(e){toast(e.msg||"沒有成功，請再試一次")}
}

/* ================= 分享到 LINE ================= */
const roomLink=()=>`https://liff.line.me/${LIFF_ID}?room=${roomId}`;
async function copyText(text,okMsg){
  try{await navigator.clipboard.writeText(text);toast(okMsg);return true}catch(e){}
  try{const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    const ok=document.execCommand("copy");ta.remove();if(ok){toast(okMsg);return true}}catch(e){}
  toast("無法自動複製，連結是："+text);return false;
}
async function shareToLine(text){
  try{
    if(liff.isApiAvailable&&liff.isApiAvailable("shareTargetPicker")){
      const res=await liff.shareTargetPicker([{type:"text",text}],{isMultiple:true});
      if(res)toast("已傳送到 LINE");return;
    }
  }catch(e){}
  await copyText(text,"已複製，請貼到 LINE 群組");
}

/* ================= 分頁 ================= */
function showTab(t){
  tab=t;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===t));
  $("tab-settle").hidden=t!=="settle";$("tab-record").hidden=t!=="record";
  renderAll();
}
function renderAll(){if(!R)return;renderTable();if(tab==="settle"){fillSetup();renderSettle()}else renderRecord()}

/* ================= 事件 ================= */
$("newRoom").addEventListener("click",createRoom);
$("lastRoom").addEventListener("click",()=>{const id=lastRoomId();if(id)openRoom(id)});
$("toLobby").addEventListener("click",showLobby);
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)showTab(b.dataset.tab)});
$("seats").addEventListener("click",e=>{const b=e.target.closest("[data-seat]");if(!b)return;const i=+b.dataset.seat;selSeat=selSeat===i?null:i;renderTable()});
$("seatAct").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b)seatAction(b.dataset.act)});
$("inviteBtn").addEventListener("click",()=>shareToLine(`【麻將結算】我開了一桌（桌號 ${roomId}），點連結用 LINE 入座：\n${roomLink()}`));
$("copyLink").addEventListener("click",()=>copyText(roomLink(),"連結已複製，貼到 LINE 群組就能邀請"));
$("shareResult").addEventListener("click",()=>shareToLine(resultText()));
document.querySelectorAll("#tab-settle select,#tab-settle input").forEach(el=>el.addEventListener("change",onSetup));
$("resType").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=draft;
  d.type=b.dataset.v;
  if(d.type!=="fang")d.loser=null;
  if(d.type==="draw")d.winner=null;
  if(d.type==="zimo")d.items.zimo=1;else delete d.items.zimo;
  if(d.type==="fang"){delete d.items.haidi;delete d.items.gangshang;delete d.items.tianhu;delete d.items.dihu}
  if((d.type==="zimo"||d.type==="fang")&&d.winner==null&&mySeat()>=0)d.winner=mySeat();
  renderSettle()});
$("winSel").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;draft.winner=+b.dataset.v;if(draft.loser===draft.winner)draft.loser=null;renderSettle()});
$("loseSel").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;draft.loser=+b.dataset.v;renderSettle()});
$("taiList").addEventListener("click",e=>{
  const st=e.target.closest("[data-step]");
  if(st){const k=st.dataset.step,lim={hua:[0,2],huagang:[0,2],adj:[-10,30]}[k];draft[k]=Math.max(lim[0],Math.min(lim[1],draft[k]+ +st.dataset.d));renderSettle();return}
  const b=e.target.closest(".tai");if(!b)return;const id=b.dataset.tai,x=TAIBY[id];
  if(draft.items[id])delete draft.items[id];
  else{if(x.g)TAI.forEach(y=>{if(y.g===x.g)delete draft.items[y.id]});draft.items[id]=1}
  const y=b.getBoundingClientRect().top;renderSettle();
  const nb=document.querySelector(`.tai[data-tai="${id}"]`);if(nb)window.scrollBy(0,nb.getBoundingClientRect().top-y);
});
$("commit").addEventListener("click",commit);
$("undoHand").addEventListener("click",()=>txReset(room=>{
  if(!room.hands.length)throw new AppErr("沒有可以復原的局");
  const last=room.hands[room.hands.length-1];
  return {hands:room.hands.slice(0,-1),game:{round:last.round,dealer:last.dealer,streak:last.streak}};
},"已復原上一局"));
$("newGame").addEventListener("click",()=>{
  const box=$("confirmBox");box.hidden=false;
  box.innerHTML=`清空這一桌所有戰績，同桌每個人的畫面都會清空。座位和金額設定會保留。<div class="row" style="margin-top:8px"><button class="ghost danger" id="ngYes">整將重來</button><button class="ghost" id="ngNo">取消</button></div>`;
  $("ngYes").onclick=()=>{box.hidden=true;txReset(room=>({hands:[],game:{round:0,dealer:room.setup.start,streak:0}}),"已清空戰績")};
  $("ngNo").onclick=()=>box.hidden=true;
});

start();
</script>
